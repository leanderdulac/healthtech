name: HealthTech CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Automated Unit & Integration Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ '3.10', '3.11' ]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Check secure vendor sync
        run: python scripts/sync_secure_vendor.py --check

      - name: Run Core Test Suite
        env:
          TESTING: "1"
          PYTHONIOENCODING: "utf-8"
          ENVIRONMENT: "development"
        run: |
          python -m pytest tests/ -q --tb=short

  test-postgres:
    name: Wearable durable store (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wearable_test
          POSTGRES_PASSWORD: wearable_test
          POSTGRES_DB: wearable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wearable_test -d wearable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Run wearable durable store + idempotency (PostgreSQL)
        env:
          TESTING: "1"
          PYTHONIOENCODING: "utf-8"
          ENVIRONMENT: "development"
          WEARABLE_REQUIRE_POSTGRES: "1"
          WEARABLE_TEST_POSTGRES_URL: postgresql://wearable_test:wearable_test@127.0.0.1:5432/wearable_test
        run: |
          python -m pytest tests/test_wearable_durable_store.py tests/test_wearable_ingest_idempotency.py -q --tb=short

  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flake8
        run: pip install flake8

      - name: Lint with Flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
