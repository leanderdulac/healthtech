name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancela runs obsoletos no mesmo ref (menos notificação de falha intermediária)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          # Core + test stack (evita torch/chromadb pesados no CI unitário)
          # requests: adapters de ingestão; google-auth: import soft de gcp_auth
          # joblib: modelos sklearn serializados (alert matrix / anomaly)
          # Pares fixos: scipy>=1.16 exige NumPy 2 (VoidDType). Em 3.11 usamos
          # o stack manylinux testado (evita rebuild source e mismatch binário).
          pip install \
            "numpy==1.26.4" \
            "scipy==1.14.1" \
            "pandas==2.2.3" \
            "pyarrow==17.0.0" \
            "scikit-learn==1.5.2" \
            "joblib==1.4.2" \
            "requests>=2.31.0" \
            "google-auth>=2.28.0" \
            "python-dotenv>=1.0.0" \
            "pydantic>=2.9.0" \
            "pydantic-settings>=2.1.0" \
            "slowapi>=0.1.9" \
            "fastapi>=0.115.0,<0.116" \
            "httpx>=0.27.0" \
            "sqlalchemy==2.0.35" \
            "pytest>=8.0.0" \
            "pytest-cov>=5.0.0" \
            "ruff>=0.5.0"

      - name: Vendor sync (secure image)
        run: python scripts/sync_secure_vendor.py --check

      - name: Ruff (caminho crítico)
        run: |
          ruff check src/security src/clinical_intelligence/alert_ingest.py \
            src/clinical_intelligence/alert_matrix_rules.py \
            saude_responsiva_secure/app \
            tests/test_alert_ingest.py tests/test_alert_matrix.py \
            tests/test_connection_status.py tests/test_vendor_sync.py \
            tests/test_security_auth.py tests/test_security_remediation.py \
            --select E,F --ignore E501

      - name: Pytest (caminho crítico)
        env:
          ENVIRONMENT: development
          SECRET_SALT: ci-test-salt-not-for-production-32b
          AUTH_DISABLED: "false"
          APP_MODE: full
          API_KEY: ""
          ADMIN_API_KEY: ht_admin_test_key_32chars_long_tokenxx
          INGEST_API_KEY: ht_ingest_test_key_32chars_long_token
          READ_API_KEY: ht_read_test_key_32chars_long_token
        run: pytest tests/ -m critical -v --tb=short

      - name: Pytest (monólito, suite leve)
        env:
          ENVIRONMENT: development
          SECRET_SALT: ci-test-salt-not-for-production-32b
          AUTH_DISABLED: "false"
          APP_MODE: full
          API_KEY: ""
          ADMIN_API_KEY: ht_admin_test_key_32chars_long_tokenxx
          INGEST_API_KEY: ht_ingest_test_key_32chars_long_token
          READ_API_KEY: ht_read_test_key_32chars_long_token
        run: |
          # test_tcn_server é pulado automaticamente sem torch (CI leve)
          pytest tests/ -v --tb=short \
            --cov=src.security --cov=src.datalake.quality \
            --cov=src.hemodynamics.operators \
            --cov-report=term-missing

      - name: Pytest (API secure)
        env:
          ENVIRONMENT: development
          SECRET_SALT: ci-test-salt-not-for-production-32b
          AUTH_DISABLED: "false"
          APP_MODE: secure
        run: |
          cd saude_responsiva_secure && PYTHONPATH=. pytest test_security.py -v --tb=short

      - name: Companion hygiene (sem secrets / sem net duplicado)
        run: |
          test -f companion-android/settings.gradle.kts
          test -f companion-android/client/build.gradle.kts
          test -f companion-android/app/build.gradle.kts
          ! test -e companion-android/app/src/main/java/com/healthtech/companion/net/HealthtechApi.kt
          if grep -RInE 'ht_ingest_test_key_|HEALTHTECH_INGEST_API_KEY=[^[:space:]#]+' \
            companion-android/app companion-android/client companion-android/README.md \
            --include='*.kt' --include='*.md' --include='*.kts' --include='*.example'; then
            echo "segredo ou chave de teste versionada no companion" >&2
            exit 1
          fi
          ! grep -RIn '10\.1\.87\.' companion-android/app/src companion-android/client --include='*.kt' --include='*.xml'

  docker-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dockerfiles (root full + secure package)
        run: |
          test -f Dockerfile
          grep -q 'USER appuser' Dockerfile
          grep -q 'uvicorn' Dockerfile
          grep -q 'HEALTHCHECK' Dockerfile
          grep -q 'saude_responsiva_secure' Dockerfile
          grep -q 'APP_MODE' Dockerfile
          test -f saude_responsiva_secure/Dockerfile
          grep -q 'USER appuser' saude_responsiva_secure/Dockerfile
          grep -q 'app.main:app' saude_responsiva_secure/Dockerfile
          test -f saude_responsiva_secure/_vendor_src/clinical_intelligence/alert_ingest.py
          test -f scripts/sync_secure_vendor.py
